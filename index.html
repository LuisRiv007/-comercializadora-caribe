<style>
:root{--bg:#000;--card:#0e0e0e;--line:#2a2a2a;--tx:#fff;--mut:#9b9b9b;--g:#22c55e;--gd:#06280f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}
#home,.in{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:4px 0 14px;color:var(--g)}

.pw{position:relative}.pw input{padding-right:58px}.pb{position:absolute;right:6px;top:10px;width:40px;height:40px;background:var(--gd);color:var(--g);border:0;border-radius:10px;display:flex;align-items:center;justify-content:center}

button{font:inherit;cursor:pointer}
.btn{background:var(--g);color:#000;border:0;border-radius:12px;padding:14px 18px;font-weight:700;width:100%}
.ghost{background:transparent;color:var(--g);border:2px solid var(--g);border-radius:12px;padding:12px 16px;font-weight:600}
.danger{color:#ff6b6b;border-color:#ff6b6b}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
textarea{min-height:80px;resize:vertical}
label{color:var(--mut);font-size:15px}
.bar{display:flex;gap:10px;margin:14px 0 4px}
.bar input{margin:0;flex:1}.bar .pw{flex:1;min-width:0}.bar .pb{top:7px}.bar .btn{width:auto;white-space:nowrap;padding:0 16px}#q{font-size:16px}#q::-webkit-search-cancel-button{-webkit-appearance:none}.bd{position:absolute;top:-5px;right:-5px;background:var(--g);color:#000;font-size:12px;font-weight:700;border-radius:10px;min-width:18px;height:18px;padding:0 4px;line-height:18px;text-align:center}.hd{display:flex;align-items:flex-start;gap:10px}.hd h1{flex:1}.ib{background:transparent;border:0;color:var(--mut);width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;margin-top:2px}.rem{position:relative;border:2px solid #f5b942;color:#f5b942;border-radius:12px;padding:10px 42px 10px 12px;margin:0 0 12px;font-size:16px}.rem-close{position:absolute;right:7px;top:6px;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#f5b942;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}.hint{color:var(--mut);font-size:15px}#bl .ghost{padding:10px 6px;font-size:16px}
#fp{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
#fp[hidden]{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}

.chip.on{background:var(--g);color:#000;border-color:var(--g);font-weight:600}
#cnt{color:var(--mut);font-size:15px;margin:10px 2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;cursor:pointer}
.card:active{border-color:var(--g)}
.cov{width:100%;height:170px;object-fit:cover;display:block;background:var(--gd)}
.nop{height:170px;display:flex;align-items:center;justify-content:center;background:var(--gd);color:var(--g)}
.cb{padding:12px 14px}
.cb b{font-size:20px;display:block}
.cb span{color:var(--mut);font-size:16px}
.pr{color:var(--g);font-weight:700;font-size:19px;margin-top:4px}
.st{display:inline-block;border-radius:10px;padding:2px 10px;font-size:14px;font-weight:700;margin-top:6px;background:var(--g);color:#000}
.s1,.s2{background:#f5b942}.s3{background:#555;color:#fff}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.ov{position:fixed;inset:0;background:var(--bg);overflow:auto;display:none;z-index:5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov.on{display:block}
.dimg{width:100%;max-height:300px;object-fit:cover;border-radius:14px;margin-top:10px}
.row{border-top:1px solid var(--line);padding:10px 0}
.row span{color:var(--mut);font-size:15px}
.row p{margin:2px 0;white-space:pre-wrap}
.tel,.map{display:inline-block;background:var(--gd);color:var(--g);border:2px solid var(--g);border-radius:12px;padding:10px 14px;margin:4px 8px 4px 0;text-decoration:none;font-weight:600}
.acts{display:grid;gap:10px;margin:18px 0 30px}.r2{display:flex;gap:10px}.r2>*{flex:1;text-align:center}.acts .map{margin:0;padding:12px 8px;font-size:17px}
.pvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}.th{position:relative}.th img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}.th button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.75);color:#fff;border:0;border-radius:50%;width:32px;height:32px;font-size:20px;line-height:1}.th i{position:absolute;left:4px;bottom:4px;background:var(--g);color:#000;font-style:normal;font-size:13px;font-weight:700;border-radius:8px;padding:1px 8px}.gal{display:flex;gap:8px;overflow-x:auto;margin-top:10px}.gal img{height:220px;width:auto;max-width:85%;border-radius:14px;object-fit:cover;flex:none}
.ck label{display:flex;align-items:center;gap:12px;color:var(--tx);font-size:18px;margin-bottom:14px}.ck input,.nb input{width:26px;height:26px;margin:0;flex:none;accent-color:var(--g)}.th.off img{opacity:.25}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--g);color:#000;font-weight:700;padding:12px 20px;border-radius:12px;display:none;z-index:9;max-width:90%}
</style>
</head>
<body>
<div id="home">
  <div class="hd"><h1>Base de Comercializadora Caribe</h1><button class="ib" onclick="openBk()" aria-label="Copias de seguridad"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button></div>
  <div id="rem" class="rem" hidden></div>
  <div class="bar"><div class="pw"><input id="q" type="search" placeholder="Buscar por nombre" oninput="render()"><button type="button" class="pb" id="fb" aria-label="Filtros" onclick="togF()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"/></svg><span class="bd" id="fbd" hidden></span></button></div><button class="btn" onclick="openForm()">+ Agregar</button></div>

    <label>Zona</label><select id="fz" onchange="render()"></select>

    <label>Características</label><div class="chips" id="fch"></div>

  </div>
  <div id="cnt"></div>

</div>

<div class="ov" id="det"></div>

<div class="ov" id="frm"><div class="in">
  <button class="ghost" onclick="closeOv()">Cancelar</button>
  <h2 id="ft2">Nuevo terreno</h2>
  <label>Fotos (toca una para ponerla de portada)</label><div class="pvs" id="pvs"></div>
  <input type="file" id="ph" accept="image/*" multiple hidden>
  <button class="ghost" style="width:100%;margin:8px 0 14px" onclick="document.getElementById('ph').click()">Agregar fotos</button>
  <label>Nombre del terreno</label><input id="f_name">
  <label>Zona</label><input id="f_zone" list="zl" placeholder="Ej: Zona norte"><datalist id="zl"></datalist>
  <label>Tipo de propiedad</label><select id="f_type"></select>
  <label>Estado</label><select id="f_state"></select>
  <div id="rsv" hidden style="border:2px solid var(--g);border-radius:14px;padding:12px;margin:0 0 14px"><label>Datos del comprador</label><input id="f_buyer" placeholder="Nombre del comprador"><input id="f_bphone" type="tel" inputmode="tel" placeholder="Teléfono del comprador"><input id="f_bprice" type="text" inputmode="numeric" oninput="fmtN(this)" placeholder="Precio acordado" style="margin-bottom:0"></div>
  <label>Características</label><div class="chips" id="fch2"></div>
  <label>Precio</label><div style="display:flex;gap:14px;align-items:center"><input id="f_price" type="text" inputmode="numeric" oninput="fmtN(this)" style="flex:1"><label class="nb" style="display:flex;align-items:center;gap:8px;color:var(--tx);margin-bottom:8px"><input type="checkbox" id="f_neg">Negociable</label></div>
  <label>Tamaño</label><div style="display:flex;gap:8px"><input id="f_size" type="number" step="any" inputmode="decimal" oninput="sizeIn()" style="flex:1"><select id="f_unit" onchange="unitCh()" style="width:auto"><option value="m²">m²</option><option value="km²">km²</option><option value="v²">v²</option><option value="mnz">Manzanas (mnz)</option><option value="acres">Acres</option></select></div>
  <label>Dirección específica</label><input id="f_address">
  <label>Ubicación exacta: marca el punto en Maps, toca Compartir, copia el enlace y pégalo aquí</label>
  <div style="margin:4px 0"><a class="ghost" id="pk" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps" onclick="pick()" style="display:block;text-align:center;text-decoration:none">Elegir en Maps</a></div>
  <div class="pw"><input id="f_map" placeholder="Enlace de la ubicación"><button type="button" class="pb" aria-label="Pegar enlace" onclick="paste()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></button></div>
  <label>Propietario</label><input id="f_owner">
  <label>Teléfonos importantes (uno por línea)</label><textarea id="f_phones"></textarea>
  <label>Asuntos legales</label><textarea id="f_legal"></textarea>
  <label>Notas generales</label><textarea id="f_notes"></textarea>
  <button class="btn" style="margin:6px 0 30px" onclick="saveForm()">Guardar terreno</button>
</div></div>
<div class="ov" id="pdf"><div class="in">
  <button class="ghost" onclick="closePdf()">Cancelar</button>
  <h2>PDF para cliente</h2>
  <label>Título y nombre del archivo</label><input id="p_name">
  <label>Descripción para este cliente (opcional)</label><textarea id="p_dtx" placeholder="Escribe aquí lo que quieras decirle a este cliente"></textarea>
  <label>Incluir en el PDF</label>
  <div class="ck" style="margin-top:8px"><label><input type="checkbox" id="p_price">Precio</label><label><input type="checkbox" id="p_addr">Dirección específica</label><label><input type="checkbox" id="p_map">Enlace de Google Maps</label></div>
  <label>Fotos (toca una para quitarla o ponerla). La primera va grande en la portada.</label><div class="pvs" id="p_ph"></div>
  <p style="color:var(--mut);font-size:15px">Siempre se incluyen tipo, zona, tamaño, características y el contacto de Melvin Rivera.</p>
  <button class="btn" id="p_go" style="margin:6px 0 30px" onclick="makePdf()">Descargar o compartir PDF</button>
</div></div>
<div class="ov" id="bk"><div class="in">
  <button class="ghost" onclick="closeBk()">Volver</button>
  <h2>Copias de seguridad</h2>
  <p class="hint">Guarda el archivo fuera del celular (correo, Drive o WhatsApp) para no perder nada.</p>
  <div class="r2" style="margin:12px 0"><button class="btn" onclick="saveBk()">Guardar copia</button><button class="ghost" onclick="$('bf').click()">Cargar copia</button></div>
  <input type="file" id="bf" accept=".json,application/json" hidden>
  <label>Copias guardadas en esta página</label><div id="bl"></div>
</div></div>
<div class="ov" id="rs" style="z-index:8"><div class="in"><h2>Cargar copia</h2><p id="rst"></p><div class="acts"><button class="btn" onclick="doRs('rep')">Reemplazar todo</button><button class="ghost" onclick="doRs('add')">Agregar a lo que ya hay</button><button class="ghost" onclick="$('rs').classList.remove('on')">Cancelar</button></div></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
var TYPES=['Casa','Edificio comercial','Planicie / lote','Finca','Otro'];
var FEATS=['Frente a la CA-13','~500 mts de la CA-13','Salida a Colón','Mar','Río','Topografía plana','Mayor plusvalía','Zona de crecimiento','Playa','Agua','Luz','Esquina','Vista'];
var STATES=['Disponible','Reservado','En negociación','Vendido'];
var K=['name','zone','type','state','price','address','map','owner','phones','legal','notes'];
var items=[];
var editId=null,cur=null,photos=[],feats=new Set(),fFeats=new Set(),m2=null,uni='m²',F={'m²':1,'km²':1e6,'v²':0.698896,'mnz':6988.96,'acres':4046.8564224};
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var money=function(n){return n==null||isNaN(n)?'':'$ '+Number(n).toLocaleString('es-AR')};
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2500)}
function dbo(){return new Promise(function(ok,no){try{var r=indexedDB.open('terrenos',1);r.onupgradeneeded=function(){r.result.createObjectStore('d')};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}}catch(e){no(e)}})}
function dbGet(){return dbo().then(function(d){return new Promise(function(ok,no){var q=d.transaction('d').objectStore('d').get('items');q.onsuccess=function(){ok(q.result)};q.onerror=function(){no(q.error)}})})}
function persist(){return dbo().then(function(d){return new Promise(function(ok,no){var t=d.transaction('d','readwrite');t.objectStore('d').put(items,'items');t.oncomplete=function(){ok(true)};t.onerror=t.onabort=function(){no(t.error)}})}).catch(function(){toast('No se pudo guardar. Revisa el espacio del celular.');return false})}
function fmtN(el){var d=el.value.replace(/\D/g,'');el.value=d?Number(d).toLocaleString('es-AR'):''}
function num(s){s=String(s||'').replace(/\./g,'');return s===''?NaN:parseFloat(s)}
function showSize(){$('f_size').value=m2==null?'':Math.round(m2/F[uni]*10000)/10000}
function sizeIn(){var v=parseFloat($('f_size').value);m2=isNaN(v)?null:v*F[uni]}
function unitCh(){uni=$('f_unit').value;showSize()}
function sz(t){if(t.sizeM2==null)return t.size||'';var u=t.sizeUnit||'m²',n=function(x){return x.toLocaleString('es-AR',{maximumFractionDigits:4})};return n(t.sizeM2/F[u])+' '+u+(u!=='m²'?' ('+n(t.sizeM2)+' m²)':'')}
function pick(){var q=($('f_address').value||$('f_zone').value||'').trim();$('pk').href=q?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q):'https://www.google.com/maps'}
function paste(){var f=$('f_map'),tip=function(){f.focus();f.select();toast('No se pudo pegar solo. Presiona Ctrl+V (o mantén presionado y elige Pegar)')};if(!navigator.clipboard||!navigator.clipboard.readText){tip();return}navigator.clipboard.readText().then(function(v){v=v.trim();if(/^https?:\/\//i.test(v)){f.value=v;toast('Enlace pegado')}else toast('Lo copiado no parece un enlace')}).catch(tip)}
var bks=[],pend=null;
function kget(k){return dbo().then(function(d){return new Promise(function(ok,no){var q=d.transaction('d').objectStore('d').get(k);q.onsuccess=function(){ok(q.result)};q.onerror=function(){no(q.error)}})})}
function kset(k,v){return dbo().then(function(d){return new Promise(function(ok,no){var t=d.transaction('d','readwrite');t.objectStore('d').put(v,k);t.oncomplete=function(){ok(true)};t.onerror=t.onabort=function(){no(t.error)}})})}
function bkJson(){return JSON.stringify({app:'terrenos',v:1,date:new Date().toISOString(),items:items})}
function fmtSz(n){return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function fdate(s){return new Date(s).toLocaleString('es-AR',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function addBk(j,n,tag){bks.push({id:Date.now().toString(36),date:new Date().toISOString(),count:n,size:j.length,json:j,tag:tag||''});bks=bks.slice(-5);return kset('backups',bks).catch(function(){toast('No se pudo guardar la copia dentro de la página')})}
function remind(){
  var el=$('rem'),lb=0,ds=0,now=Date.now(),period=14*864e5;
  try{lb=parseInt(localStorage.getItem('lastBk')||'0',10);ds=parseInt(localStorage.getItem('remDismiss')||'0',10)}catch(e){}
  if(!items.length||(lb&&now-lb<period)||(ds&&now-ds<period)){el.hidden=true;return}
  el.innerHTML='<button class="rem-close" type="button" aria-label="Cerrar aviso" title="Recordármelo en 14 días" onclick="dismissRem()">×</button><span>'+(lb?'Hace más de 2 semanas que no guardas una copia de seguridad.':'Aún no has guardado una copia de seguridad.')+'</span><br><button class="ghost" style="margin-top:8px;padding:8px 14px" onclick="saveBk()">Guardar ahora</button>';
  el.hidden=false
}
function dismissRem(){try{localStorage.setItem('remDismiss',String(Date.now()))}catch(e){}$('rem').hidden=true}
function openBk(){drawBk();$('bk').classList.add('on');$('bk').scrollTop=0}
function closeBk(){$('bk').classList.remove('on')}
function drawBk(){$('bl').innerHTML=bks.length?bks.slice().reverse().map(function(b){return'<div class="row"><b>'+fdate(b.date)+'</b>'+(b.tag?' <span>('+esc(b.tag)+')</span>':'')+'<p>'+b.count+' terrenos - '+fmtSz(b.size)+'</p><div class="r2"><button class="ghost" data-a="rs" data-id="'+b.id+'">Restaurar</button><button class="ghost" data-a="fl" data-id="'+b.id+'">Guardar archivo</button><button class="ghost danger" data-a="dl" data-id="'+b.id+'">Borrar</button></div></div>'}).join('')+'<p class="hint">Espacio que ocupan: '+fmtSz(bks.reduce(function(s,b){return s+b.size},0))+'. Se guardan solo las últimas 5.</p>':'<p class="hint">Todavía no hay copias guardadas aquí.</p>'}
async function fileBk(j,iso,up){
  var name='respaldo-terrenos-'+iso.slice(0,10)+'.json';
  var file=new File([j],name,{type:'application/json'});
  var shared=false;
  if(navigator.share&&navigator.canShare){
    try{
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:'Copia de seguridad de terrenos',text:'Guarda este archivo en Google Drive.'});
        shared=true;
      }
    }catch(e){
      if(e&&e.name==='AbortError'){
        toast('No se compartió la copia');
        return false;
      }
      // Android/browser share failed: try a direct download below.
    }
  }
  if(!shared){
    try{
      var url=URL.createObjectURL(file),a=document.createElement('a');
      a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);
      a.click();
      setTimeout(function(){a.remove();URL.revokeObjectURL(url)},3000);
    }catch(e){
      toast('No se pudo iniciar la descarga. Prueba desde Chrome y revisa los permisos de archivos.');
      return false;
    }
  }
  if(up){
    try{localStorage.setItem('lastBk',String(Date.now()));localStorage.removeItem('remDismiss')}catch(e){}
    remind();
  }
  toast(shared?'Copia lista para compartir. Elige Drive u otro destino.':'Descarga iniciada. Busca el archivo en Descargas y súbelo a Drive.');
  return true;
}
async function saveBk(){if(!items.length){toast('No hay terrenos que guardar');return}var j=bkJson(),iso=new Date().toISOString();if(await fileBk(j,iso,true)){await addBk(j,items.length);drawBk()}}
function valid(o){return o&&Array.isArray(o.items)&&o.items.every(function(t){return t&&typeof t==='object'&&t.name!=null})}
function ask(o){if(!valid(o)){toast('Ese archivo no es una copia válida');return}pend=o;if(!items.length){doRs('rep');return}$('rst').textContent='La copia tiene '+o.items.length+' terrenos y ahora hay '+items.length+' cargados.';$('rs').classList.add('on')}
async function doRs(m){var o=pend;if(!o)return;$('rs').classList.remove('on');var inc=o.items.map(function(t){t.photos=t.photos||(t.photo?[t.photo]:[]);if(t.sizeUnit==='varas²')t.sizeUnit='v²';t.id=t.id||Date.now().toString(36)+Math.random().toString(36).slice(2,5);t.created=t.created||Date.now();return t}),msg;if(m==='rep'){if(items.length)await addBk(bkJson(),items.length,'antes de reemplazar');items=inc;msg='Se cargaron '+inc.length+' terrenos'}else{var have=new Set(items.map(function(t){return t.id})),nw=inc.filter(function(t){return !have.has(t.id)});items=items.concat(nw);msg='Se agregaron '+nw.length+' terrenos'+(inc.length>nw.length?' ('+(inc.length-nw.length)+' ya estaban)':'')}pend=null;if(await persist()){render();drawBk();toast(msg)}}
$('bl').onclick=function(e){var b=e.target,a=b.dataset.a,id=b.dataset.id;if(!a)return;var k=bks.find(function(x){return x.id===id});if(!k)return;if(a==='rs'){try{ask(JSON.parse(k.json))}catch(x){toast('No se pudo leer esa copia')}}else if(a==='fl')fileBk(k.json,k.date,false);else if(a==='dl'){if(!b.dataset.s){b.dataset.s='1';b.textContent='Toca de nuevo';setTimeout(function(){b.dataset.s='';b.textContent='Borrar'},3000);return}bks=bks.filter(function(x){return x.id!==id});kset('backups',bks);drawBk();toast('Copia borrada')}};
$('bf').onchange=function(e){var f=e.target.files[0];e.target.value='';if(!f)return;var r=new FileReader();r.onload=function(){try{ask(JSON.parse(r.result))}catch(x){toast('Ese archivo no es una copia válida')}};r.readAsText(f)};
var pSel=[];
function ci(){return items.find(function(x){return x.id===cur})}
function openPdf(){var t=ci();if(!t)return;$('p_name').value=t.name;$('p_price').checked=t.price!=null;$('p_dtx').value='';$('p_addr').checked=false;$('p_map').checked=false;pSel=t.photos.map(function(){return true});drawP();$('pdf').classList.add('on');$('pdf').scrollTop=0}

function tgl(i){pSel[i]=!pSel[i];drawP()}
function drawP(){var t=ci();$('p_ph').innerHTML=t.photos.length?t.photos.map(function(p,i){return'<div class="th'+(pSel[i]?'':' off')+'"><img alt="" src="'+p+'" onclick="tgl('+i+')">'+(pSel[i]?'':'<i style="background:#555;color:#fff">Fuera</i>')+'</div>'}).join(''):'<p style="color:var(--mut);grid-column:1/-1">Este terreno no tiene fotos.</p>'}
function ld(p){return new Promise(function(ok){var im=new Image();im.onload=function(){ok({p:p,w:im.width,h:im.height})};im.onerror=function(){ok(null)};im.src=p})}
function put(d,o,x,y,bw,bh,c){var r=Math.min(bw/o.w,bh/o.h),w=o.w*r,h=o.h*r;d.addImage(o.p,'JPEG',x+(bw-w)/2,y+(c?(bh-h)/2:0),w,h,undefined,'FAST');return h}
async function makePdf(){
  var t=ci();if(!t)return;
  if(!window.jspdf){toast('No cargó el generador de PDF. Revisa la conexión.');return}
  var b=$('p_go');b.disabled=true;b.textContent='Generando…';
  try{
    var d=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),M=15,CW=180,y=M,title=$('p_name').value.trim()||t.name;
    var chk=function(h){if(y+h>285){d.addPage();y=M}};
    d.setFont('helvetica','bold');d.setFontSize(22);d.setTextColor(0);
    var tl=d.splitTextToSize(title,CW);d.text(tl,M,y+7);y+=tl.length*9+2;
    d.setLineWidth(0.6);d.line(M,y,M+CW,y);y+=6;
    var ims=(await Promise.all(t.photos.filter(function(p,i){return pSel[i]}).map(ld))).filter(Boolean);
    if(ims.length)y+=put(d,ims[0],M,y,CW,95)+8;
    var row=function(l,v){if(!v)return;var ln=d.splitTextToSize(v,CW-40);chk(ln.length*5.5+3);d.setFont('helvetica','bold');d.setFontSize(11);d.text(l,M,y);d.setFont('helvetica','normal');d.text(ln,M+40,y);y+=ln.length*5.5+3};
    row('Tipo',t.type);row('Zona',t.zone);row('Tamaño',sz(t));
    if($('p_price').checked&&t.price!=null)row('Precio',money(t.price)+(t.negoc?' (negociable)':''));
    if($('p_addr').checked)row('Dirección',t.address);
    row('Características',(t.feats||[]).join(', '));
    if($('p_map').checked&&t.map){chk(8);d.setFont('helvetica','bold');d.setFontSize(11);d.text('Ubicación',M,y);d.setFont('helvetica','normal');d.textWithLink('Abrir en Google Maps',M+40,y,{url:t.map});y+=8}
    var dx=$('p_dtx').value.trim();if(dx){chk(16);d.setFont('helvetica','bold');d.setFontSize(11);d.text('Descripción',M,y);y+=6;d.setFont('helvetica','normal');d.splitTextToSize(dx,CW).forEach(function(l){chk(6);d.text(l,M,y);y+=5.5});y+=3}
    row('Contacto','Melvin Rivera\n+504 9432-5209');
    var rest=ims.slice(1),i=0,vt=function(o){return o.h>o.w};
    while(i<rest.length){d.addPage();var a=rest[i];
      if(vt(a)||i+1>=rest.length||vt(rest[i+1])){put(d,a,M,M,CW,267,1);i++}
      else{put(d,a,M,M,CW,128,1);put(d,rest[i+1],M,M+139,CW,128,1);i+=2}}
    var fn=(title.replace(/[\\/\\\\:*?\"<>|]+/g,'').trim()||'ficha')+'.pdf';
    var blob=d.output('blob'),file=new File([blob],fn,{type:'application/pdf'});
    if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Ficha de terreno',text:'Ficha de terreno de Comercializadora Caribe'});
    }else{
      var url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},1500);
    }
    toast('PDF preparado');closePdf();
  }catch(e){if(e&&e.name==='AbortError')toast('No se compartió el PDF');else toast('No se pudo crear el PDF')}
  b.disabled=false;b.textContent='Descargar o compartir PDF';
}
function togR(){var s=$('f_state').value;$('rsv').hidden=s!=='Reservado'&&s!=='Vendido'}
function bb(t){if(t.state!=='Reservado'&&t.state!=='Vendido')return'';if(!t.buyer&&!t.bphone&&t.bprice==null)return'';var p=t.bphone?'<a class="tel" href="tel:'+esc(t.bphone.replace(/[^\d+]/g,''))+'">Llamar '+esc(t.bphone)+'</a>':'';return'<div class="rv"><span>'+(t.state==='Vendido'?'Comprador':'Reservado por')+'</span><b>'+esc(t.buyer||'')+'</b>'+(t.bprice!=null?'<div>Precio acordado: <b>'+money(t.bprice)+'</b></div>':'')+p+'</div>'}
function cover(i){var p=photos.splice(i,1)[0];photos.unshift(p);prev()}
function rmPh(i){photos.splice(i,1);prev()}
function opts(sel,list,first){sel.innerHTML='<option value="">'+first+'</option>'+list.map(function(x){return'<option>'+esc(x)+'</option>'}).join('')}
function chips(el,set,cb){el.innerHTML=FEATS.map(function(f){return'<button type="button" class="chip'+(set.has(f)?' on':'')+'" data-f="'+f+'">'+f+'</button>'}).join('');el.onclick=function(e){var f=e.target.dataset.f;if(!f)return;set.has(f)?set.delete(f):set.add(f);chips(el,set,cb);if(cb)cb()}}
function togF(){$('fp').hidden=!$('fp').hidden}
function clr(){['q','fo','fmin','fmax'].forEach(function(i){$(i).value=''});['fz','ft','fs'].forEach(function(i){$(i).value=''});fFeats.clear();chips($('fch'),fFeats,render);render()}
function zones(){return Array.from(new Set(items.map(function(t){return t.zone}).filter(Boolean))).sort()}
function render(){
  var z=zones(),zv=$('fz').value;
  opts($('fz'),z,'Todas las zonas');$('fz').value=z.indexOf(zv)>-1?zv:'';
  $('zl').innerHTML=z.map(function(x){return'<option value="'+esc(x)+'">'}).join('');

  var act=(fz?1:0)+(ft?1:0)+(fs?1:0)+(fo?1:0)+(isNaN(mn)?0:1)+(isNaN(mx)?0:1)+fFeats.size;
  $('fbd').textContent=act;$('fbd').hidden=!act;remind();
  var list=items.filter(function(t){
    if(q&&t.name.toLowerCase().indexOf(q)<0)return false;
    if(fz&&t.zone!==fz)return false;
    if(ft&&t.type!==ft)return false;
    if(fs&&t.state!==fs)return false;
    if(fo&&(t.owner||'').toLowerCase().indexOf(fo)<0)return false;
    if(!isNaN(mn)&&(t.price==null||t.price<mn))return false;
    if(!isNaN(mx)&&(t.price==null||t.price>mx))return false;
    for(var f of fFeats){if((t.feats||[]).indexOf(f)<0)return false}
    return true}).sort(function(a,b){return b.created-a.created});
  $('cnt').textContent=items.length?list.length+' de '+items.length+' terrenos':'';
  $('list').innerHTML=list.length?list.map(function(t){
    var si=Math.max(0,STATES.indexOf(t.state));
    return'<div class="card" onclick="show(\''+t.id+'\')">'+(t.photos[0]?'<img class="cov" alt="" src="'+t.photos[0]+'">':'<div class="nop">Sin foto</div>')+'<div class="cb"><b>'+esc(t.name)+'</b><span>'+esc([t.zone,t.type].filter(Boolean).join(' - '))+'</span>'+(t.price!=null?'<div class="pr">'+money(t.price)+(t.negoc?' (negociable)':'')+'</div>':'')+(t.state?'<div class="st s'+si+'">'+esc(t.state)+'</div>':'')+'</div></div>'}).join(''):
    '<div class="empty">'+(items.length?'Ningún terreno coincide con la búsqueda.':'Todavía no hay terrenos. Toca «Agregar terreno» para empezar.')+'</div>';
}
function show(id){

  var row=function(l,v){return v?'<div class="row"><span>'+l+'</span><p>'+esc(v)+'</p></div>':''};
  var tels=(t.phones||'').split(/[\n,;]+/).map(function(s){return s.trim()}).filter(Boolean).map(function(p){return'<a class="tel" href="tel:'+esc(p.replace(/[^\d+]/g,''))+'">Llamar '+esc(p)+'</a>'}).join('');

    '<h2>'+esc(t.name)+'</h2>'+(t.state?'<div class="st s'+Math.max(0,STATES.indexOf(t.state))+'">'+esc(t.state)+'</div>':'')+
    (t.price!=null?'<div class="pr" style="font-size:24px">'+money(t.price)+(t.negoc?' (negociable)':'')+'</div>':'')+
    '<div style="margin-top:10px">'+bb(t)+row('Tipo',t.type)+row('Zona',t.zone)+row('Tamaño',sz(t))+row('Dirección',t.address)+row('Propietario',t.owner)+
    ((t.feats||[]).length?row('Características',t.feats.join(', ')):'')+
    (tels?'<div class="row"><span>Teléfonos</span><div>'+tels+'</div></div>':'')+
    row('Asuntos legales',t.legal)+row('Notas',t.notes)+
    row('Fecha en que se agregó',new Date(t.created).toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'}))+'</div>'+
    '<div class="acts"><div class="r2">'+(t.map?'<a class="map" target="_blank" rel="noopener" href="'+esc(t.map)+'">Ver en Maps</a>':loc?'<a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(loc)+'">Buscar en Maps</a>':'')+
    '<button class="btn" onclick="openPdf()">Generar PDF</button></div><div class="r2"><button class="ghost" onclick="openForm(\''+id+'\')">Editar</button><button class="ghost danger" onclick="del(this)">Eliminar</button></div></div></div>';
  $('det').classList.add('on');$('det').scrollTop=0;

function del(b){
  if(!b.dataset.s){b.dataset.s='1';b.textContent='Toca de nuevo';setTimeout(function(){b.dataset.s='';b.textContent='Eliminar'},3000);return}
  items=items.filter(function(x){return x.id!==cur});persist();closeOv();render();toast('Terreno eliminado');
}

  $('f_price').value=t.price==null?'':Number(t.price).toLocaleString('es-AR');m2=t.sizeM2==null?null:t.sizeM2;uni=t.sizeUnit||'m²';$('f_unit').value=uni;showSize();$('f_neg').checked=!!t.negoc;$('f_buyer').value=t.buyer||'';$('f_bphone').value=t.bphone||'';$('f_bprice').value=t.bprice==null?'':Number(t.bprice).toLocaleString('es-AR');togR();

$('ph').onchange=function(e){
  Array.from(e.target.files).forEach(function(f){var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    photos.push(c.toDataURL('image/jpeg',0.7));prev()};im.src=r.result};
  r.readAsDataURL(f)});e.target.value='';
};
function saveForm(){
  var o=editId?items.find(function(x){return x.id===editId}):{id:Date.now().toString(36),created:Date.now()};
  K.forEach(function(k){o[k]=$('f_'+k).value.trim()});
  o.price=isNaN(num(o.price))?null:num(o.price);o.sizeM2=m2;o.sizeUnit=$('f_unit').value;o.name=o.name||'Terreno sin nombre';o.photos=photos;delete o.photo;o.feats=Array.from(feats);o.negoc=$('f_neg').checked;o.buyer=$('f_buyer').value.trim();o.bphone=$('f_bphone').value.trim();o.bprice=isNaN(num($('f_bprice').value))?null:num($('f_bprice').value);

chips($('fch'),fFeats,render);

dbGet().then(function(v){return v||old()},old).then(function(v){items=v||[];items.forEach(function(t){if(!t.photos)t.photos=t.photo?[t.photo]:[];if(t.sizeUnit==='varas²')t.sizeUnit='v²'});render()});
try{navigator.storage.persist()}catch(e){}
kget('backups').then(function(v){bks=v||[]}).catch(function(){});
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./service-worker.js').catch(function(){});
  });
